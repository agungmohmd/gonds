<div id="titlebar">
  <div id="titlebar-drag"></div>
  <span id="title-text">Gonds</span>
</div>

<div id="ribbon">
  <div class="rib-group">
    <button class="rib" data-action="toggle-sidebar" title="Sidebar (⌥⌘B)"><svg><use href="#i-sidebar"/></svg></button>
  </div>
  <div class="rib-sep"></div>
  <div class="rib-group">
    <button class="rib primary" data-action="quick-connect" title="Connect to a host (⌘K)"><svg><use href="#i-server"/></svg></button>
    <button class="rib" data-action="new-shell" title="New local shell (⌘T)"><svg><use href="#i-shell"/></svg></button>
    <button class="rib" data-action="new-session" title="New saved session (⇧⌘N)"><svg><use href="#i-plus"/></svg></button>
  </div>
  <div class="rib-sep"></div>
  <div class="rib-group">
    <button class="rib" data-action="split-right" title="Split right (⌘D)"><svg><use href="#i-split"/></svg></button>
    <button class="rib" data-action="toggle-sftp" title="SFTP panel (⌘B)"><svg><use href="#i-folder-open"/></svg></button>
  </div>
  <div class="rib-sep"></div>
  <div class="rib-group">
    <button class="rib" data-action="broadcast" title="Broadcast typing to every terminal (⇧⌘M)"><svg><use href="#i-broadcast"/></svg></button>
    <button class="rib" data-action="macros" title="Macros"><svg><use href="#i-macro"/></svg></button>
    <button class="rib" data-action="tunnels" title="Port forwarding"><svg><use href="#i-tunnel"/></svg></button>
    <button class="rib" data-action="tools-menu" title="Network &amp; system tools"><svg><use href="#i-tools"/></svg></button>
  </div>
  <div class="rib-spacer"></div>
  <div class="rib-group">
    <button class="rib" data-action="settings" title="Settings (⌘,)"><svg><use href="#i-settings"/></svg></button>
  </div>
</div>

<div id="main">
  <aside id="sidebar">
    <div id="sidebar-head">
      <div class="sb-search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="session-filter" type="text" placeholder="Filter sessions…" spellcheck="false">
      </div>
      <div class="sb-actions">
        <button class="mini" data-action="new-session" title="New session"><svg><use href="#i-plus"/></svg></button>
        <button class="mini" data-action="new-folder" title="New folder"><svg><use href="#i-folder"/></svg></button>
        <button class="mini" data-action="import-sessions" title="Import sessions"><svg><use href="#i-download"/></svg></button>
      </div>
    </div>
    <div id="sidebar-body">
      <div class="sb-pane" data-pane="sessions"><div id="session-tree" class="tree" tabindex="0"></div></div>
      <div class="sb-pane" data-pane="tools" hidden><div id="tools-pane"></div></div>
      <div class="sb-pane" data-pane="macros" hidden><div id="macros-pane"></div></div>
      <div class="sb-pane" data-pane="tunnels" hidden><div id="tunnels-pane"></div></div>
    </div>
    <div id="sidebar-tabs">
      <button class="sb-tab active" data-pane="sessions">Sessions</button>
      <button class="sb-tab" data-pane="tools">Tools</button>
      <button class="sb-tab" data-pane="macros">Macros</button>
      <button class="sb-tab" data-pane="tunnels">Tunnels</button>
    </div>
    <div id="sidebar-resize" class="vresize"></div>
  </aside>

  <section id="work">
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="tab-add" class="tab-add" title="New tab"><svg><use href="#i-plus"/></svg></button>
    </div>
    <div id="panes"></div>
  </section>
</div>

<div id="statusbar">
  <span id="status-session">No session</span>
  <span class="sb-dot"></span>
  <span id="status-conn">—</span>
  <span class="sb-grow"></span>
  <span id="status-broadcast" hidden class="warn">Broadcast ON</span>
  <span id="status-transfers"></span>
  <span id="status-size">—</span>
  <span id="status-scheme">—</span>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
<script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
<script src="js/util.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/terminal.js"></script>
<script src="js/sftp.js"></script>
<script src="js/tabs.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/toolsui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
